<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RS3 Stats — ScarosZ vs Dux Daedalus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c11;
    --panel:#14181f;
    --panel-2:#1b2029;
    --line:#2a313d;
    --txt:#e7e9ee;
    --muted:#8b93a3;
    --gold:#f5c542;
    --gold-bright:#ffe07a;
    --p1:#3da5ff;          /* ScarosZ — azure */
    --p1-bright:#7cc6ff;
    --p2:#ff6b4a;          /* Dux Daedalus — ember */
    --p2-bright:#ff9277;
    --win:#3ad17a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--txt);
    background:
      radial-gradient(1200px 700px at 20% -10%, rgba(61,165,255,.10), transparent 60%),
      radial-gradient(1200px 700px at 80% -10%, rgba(255,107,74,.10), transparent 60%),
      radial-gradient(900px 900px at 50% 120%, rgba(245,197,66,.06), transparent 60%),
      var(--bg);
    min-height:100vh;
    padding:clamp(14px,3vw,42px);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1000px;margin:0 auto}

  /* ---------- Title ---------- */
  .title{text-align:center;margin-bottom:clamp(18px,3vw,30px)}
  .title .kicker{
    font-family:'Cinzel',serif;letter-spacing:.32em;text-transform:uppercase;
    font-size:clamp(11px,1.6vw,13px);color:var(--gold);font-weight:700;
  }
  .title h1{
    font-family:'Cinzel',serif;font-weight:900;line-height:1.05;
    font-size:clamp(26px,5.4vw,52px);margin:6px 0 4px;
    background:linear-gradient(180deg,#fff,#cfd6e3 60%,#9aa3b4);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 30px rgba(0,0,0,.4);
  }
  .title .sub{color:var(--muted);font-size:clamp(12px,1.7vw,14px)}

  /* ---------- Total-level header cards ---------- */
  .totals{
    display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(8px,1.6vw,18px);
    align-items:stretch;margin:34px 0 22px;
  }
  .pcard{
    position:relative;border:1px solid var(--line);border-radius:18px;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    padding:clamp(16px,2.6vw,26px);overflow:visible;
    transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .pcard::before{content:"";position:absolute;inset:0;opacity:.5;pointer-events:none;border-radius:18px;
    background:radial-gradient(120% 80% at 50% -20%, var(--accent-soft), transparent 70%);}
  .pcard.p1{--accent:var(--p1);--accent-soft:rgba(61,165,255,.18)}
  .pcard.p2{--accent:var(--p2);--accent-soft:rgba(255,107,74,.18)}
  .pcard .pname{
    display:flex;align-items:center;gap:8px;font-family:'Cinzel',serif;font-weight:700;
    font-size:clamp(15px,2.4vw,21px);color:#fff;letter-spacing:.02em;
  }
  .pcard.p2 .pname{justify-content:flex-end;text-align:right}
  .pcard .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
  .pcard .label{margin-top:14px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  .pcard.p2 .label,.pcard.p2 .totxp,.pcard.p2 .rank{text-align:right}
  .pcard .totlvl{font-family:'Cinzel',serif;font-weight:900;line-height:1;
    font-size:clamp(46px,11vw,92px);
    background:linear-gradient(180deg,#fff,var(--accent));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .pcard .totxp{margin-top:6px;font-weight:700;font-size:clamp(13px,2vw,16px);color:var(--txt)}
  .pcard .totxp span{color:var(--muted);font-weight:500}
  .pcard .rank{margin-top:2px;font-size:12px;color:var(--muted)}

  /* winner styling */
  .pcard.winner{border-color:rgba(245,197,66,.55);
    box-shadow:0 0 0 1px rgba(245,197,66,.25), 0 18px 50px -18px rgba(245,197,66,.45);}
  .pcard.winner .totlvl{background:linear-gradient(180deg,#fff,var(--gold-bright) 55%,var(--gold));
    -webkit-background-clip:text;background-clip:text;}
  .crown{position:absolute;top:-34px;left:50%;width:clamp(46px,7.4vw,62px);height:clamp(46px,7.4vw,62px);
    color:var(--gold);transform-origin:bottom center;opacity:0;
    transform:translateX(-50%) translateY(8px) scale(.55);pointer-events:none;
    filter:drop-shadow(0 5px 12px rgba(245,197,66,.55)) drop-shadow(0 0 20px rgba(245,197,66,.4));
    transition:opacity .55s ease,transform .55s cubic-bezier(.2,1.5,.4,1)}
  .pcard.winner .crown{opacity:1;animation:crownFloat 3.4s ease-in-out infinite}
  @keyframes crownFloat{
    0%,100%{transform:translateX(-50%) translateY(0) scale(1)}
    50%{transform:translateX(-50%) translateY(-5px) scale(1.025)}
  }

  .vs{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:54px}
  .vs .vtext{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(20px,4vw,34px);
    color:var(--gold);text-shadow:0 0 18px rgba(245,197,66,.4)}
  .vs .delta{font-size:11px;color:var(--muted);text-align:center;line-height:1.3}

  /* ---------- Summary strip ---------- */
  .summary{
    display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:0 0 22px;
  }
  .chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
    border-radius:999px;padding:8px 15px;font-size:13px;font-weight:600;color:var(--txt)}
  .chip b{font-family:'Cinzel',serif}
  .chip .sw{width:9px;height:9px;border-radius:50%}
  .chip .sw.p1{background:var(--p1)}.chip .sw.p2{background:var(--p2)}.chip .sw.t{background:var(--muted)}

  /* ---------- Headline stat tiles ---------- */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,1.4vw,14px);margin-bottom:20px}
  .tile{position:relative;border:1px solid var(--line);border-radius:14px;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));padding:13px 12px 14px;text-align:center;overflow:hidden}
  .tile .ticon{height:30px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:6px}
  .tile .ticon img{height:25px;width:auto;max-width:46px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))}
  .tile.danger{border-color:rgba(226,59,50,.38)}
  .tile.danger::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:14px;
    background:radial-gradient(110% 70% at 50% 0%, rgba(226,59,50,.14), transparent 68%)}
  .tile .ticon.danger img{height:30px;animation:skullPulse 2.4s ease-in-out infinite}
  @keyframes skullPulse{
    0%,100%{transform:scale(1);filter:drop-shadow(0 0 6px rgba(226,59,50,.7))}
    50%{transform:scale(1.1);filter:drop-shadow(0 0 13px rgba(255,60,46,1))}
  }
  .tile .tlabel{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .tile .tsub{font-size:10px;color:#5e6675;margin-top:1px}
  .tvals{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:9px}
  .tv{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;flex:1}
  .tv .num{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(17px,2.7vw,24px);line-height:1;color:#9aa3b4;white-space:nowrap}
  .tv .who{display:flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .tv .who .sw{width:7px;height:7px;border-radius:50%}
  .tv.p1 .who .sw{background:var(--p1)}.tv.p2 .who .sw{background:var(--p2)}
  .tv.win .num{color:var(--gold-bright);text-shadow:0 0 16px rgba(245,197,66,.35)}
  .tv.win .num::after{content:" ▲";font-size:.52em;color:var(--gold);vertical-align:middle}
  .tv.lose .num{color:#5b6373}
  .tcmp{font-family:'Cinzel',serif;font-weight:700;color:var(--muted);font-size:15px;opacity:.6}
  .tile.tie::after{content:"TIE";position:absolute;top:9px;right:10px;font-size:8.5px;font-weight:800;
    letter-spacing:.1em;color:var(--gold);opacity:.9}

  /* ---------- Activity feed ---------- */
  .feedhead{font-family:'Cinzel',serif;font-weight:700;color:var(--gold-bright);text-align:center;
    font-size:clamp(15px,2.4vw,19px);margin:30px 0 14px;letter-spacing:.04em}
  .feed{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.6vw,16px)}
  .fcol{border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--panel-2),var(--panel));padding:14px 16px}
  .fcol h3{display:flex;align-items:center;gap:8px;font-family:'Cinzel',serif;font-size:14px;font-weight:700;margin-bottom:10px}
  .fcol.p1 h3{color:var(--p1-bright)}.fcol.p2 h3{color:var(--p2-bright)}
  .fcol .dot{width:9px;height:9px;border-radius:50%}
  .fcol.p1 .dot{background:var(--p1)}.fcol.p2 .dot{background:var(--p2)}
  .act{display:flex;gap:10px;padding:7px 0;border-top:1px solid rgba(255,255,255,.05);font-size:12.5px}
  .act:first-of-type{border-top:none}
  .act .ad{color:var(--muted);font-weight:600;white-space:nowrap;font-size:11px;min-width:46px;padding-top:1px}
  .act .at{color:var(--txt);line-height:1.35}

  /* ---------- Controls ---------- */
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
  .seg button{background:none;border:none;color:var(--muted);font:inherit;font-weight:600;font-size:12.5px;
    padding:7px 13px;border-radius:7px;cursor:pointer;transition:.15s}
  .seg button.active{background:var(--panel-2);color:#fff;box-shadow:inset 0 0 0 1px var(--line)}
  .status{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted)}
  .status .live{width:8px;height:8px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 0 rgba(58,209,122,.5)}
  .status.ok .live{background:var(--win);animation:pulse 2s infinite}
  .status.err .live{background:var(--p2)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(58,209,122,.5)}70%{box-shadow:0 0 0 7px rgba(58,209,122,0)}100%{box-shadow:0 0 0 0 rgba(58,209,122,0)}}
  .refresh{background:var(--panel);border:1px solid var(--line);color:var(--txt);font:inherit;font-weight:600;
    font-size:12.5px;padding:8px 14px;border-radius:9px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:7px}
  .refresh:hover{border-color:var(--gold);color:var(--gold-bright)}
  .refresh svg{width:14px;height:14px}
  .refresh.spin svg{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- Skill rows ---------- */
  .legend{display:grid;grid-template-columns:1fr minmax(150px,200px) 1fr;align-items:center;
    padding:0 6px 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .legend .l{text-align:right}.legend .c{text-align:center}.legend .r{text-align:left}
  .legend .c span{color:var(--gold)}

  .rows{display:flex;flex-direction:column;gap:7px}
  .row{
    display:grid;grid-template-columns:1fr minmax(150px,200px) 1fr;align-items:center;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:12px;padding:9px 12px;
    transition:transform .18s ease,border-color .18s ease;
  }
  .row:hover{transform:translateY(-1px);border-color:#39414f}

  .side{display:flex;align-items:center;gap:10px}
  .side.left{flex-direction:row-reverse}
  .lvl{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(17px,2.6vw,23px);
    min-width:2.4ch;text-align:center;color:var(--muted);position:relative;transition:color .2s}
  .bar{flex:1;height:14px;border-radius:7px;background:rgba(255,255,255,.05);overflow:hidden;position:relative;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
  .fill{position:absolute;top:0;bottom:0;width:0;border-radius:7px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .left .fill{right:0;background:linear-gradient(90deg,transparent,var(--p1))}
  .right .fill{left:0;background:linear-gradient(90deg,var(--p2),transparent)}

  /* winner emphasis */
  .side.win .lvl{color:var(--gold-bright)}
  .side.win .lvl::after{content:"▲";position:absolute;font-size:.5em;color:var(--gold);
    top:50%;transform:translateY(-50%)}
  .side.left.win .lvl::after{left:-1.1em}
  .side.right.win .lvl::after{right:-1.1em}
  .left.win .fill{background:linear-gradient(90deg,rgba(245,197,66,.25),var(--gold));box-shadow:0 0 14px rgba(245,197,66,.45)}
  .right.win .fill{background:linear-gradient(90deg,var(--gold),rgba(245,197,66,.25));box-shadow:0 0 14px rgba(245,197,66,.45)}
  .side.lose .lvl{color:#5b6373}
  .side.lose .fill{opacity:.5}

  .skill{display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 4px}
  .skill img{width:26px;height:26px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
  .skill .nm{font-size:11.5px;font-weight:600;color:var(--txt);text-align:center;line-height:1.1}
  .skill .gap{font-size:10px;color:var(--muted);font-weight:600}
  .skill .gap.tie{color:var(--gold)}

  /* overall row accent */
  .row.overall{border-color:rgba(245,197,66,.4);background:linear-gradient(180deg,#221f17,#171821)}
  .row.overall .skill .nm{color:var(--gold-bright);font-family:'Cinzel',serif;font-weight:700}

  footer{text-align:center;color:var(--muted);font-size:11.5px;margin-top:26px;line-height:1.7}
  footer a{color:var(--p1-bright);text-decoration:none}
  footer a:hover{text-decoration:underline}

  @media(max-width:560px){
    .totals{grid-template-columns:1fr 1fr;gap:8px}
    .vs{grid-column:1 / -1;order:-1;flex-direction:row;gap:14px;min-width:0}
    .legend,.row{grid-template-columns:1fr 104px 1fr}
    .skill img{width:22px;height:22px}
    .skill .nm{font-size:10px}
    .bar{height:11px}
  }

  .update-controls{display:flex;gap:10px;align-items:center;min-width:0}
  .status{line-height:1.5;min-width:0}
  .status .live{flex-shrink:0}
  .update-note{font-size:12px;color:var(--muted);margin:-4px 0 18px;line-height:1.5}
  .refresh{flex-shrink:0}
  .refresh:disabled{cursor:wait;opacity:.65}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .tv.lose .num,.side.lose .lvl{color:#a4adbc}
  .tile .tsub{color:var(--muted);font-size:12px}
  .tile .who,.tile .tlabel{font-size:11px}
  .pcard,.fcol,.tile,.side{min-width:0}
  .pcard .dot{flex-shrink:0}
  .pcard.p2 .totlvl{text-align:right}
  .act .ad{white-space:normal;flex:0 0 70px}
  @media(max-width:700px){
    .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
    .controls{align-items:flex-start}
    .update-controls{width:100%;justify-content:space-between}
  }
  @media(max-width:560px){
    .pcard{padding:22px 10px 14px}
    .tile{padding:13px 8px 14px}
    .tvals{gap:4px}
    .tv .num{font-size:clamp(15px,4.3vw,20px)}
    .tv .who{font-size:10px;letter-spacing:0;gap:3px}
    .pcard .pname{font-size:14px;gap:5px;min-height:36px}
    .pcard .dot{width:7px;height:7px}
    .pcard .totlvl{font-size:clamp(32px,9vw,48px)}
    .pcard .totxp{font-size:12px;line-height:1.5}
    .pcard .totxp span{display:block}
    .vs{margin-bottom:22px}
    .feed{grid-template-columns:1fr}
    .legend,.row{grid-template-columns:minmax(0,1fr) 104px minmax(0,1fr)}
    .row{padding:9px 10px}
    .side{gap:5px}
    .side .bar{display:none}
    .side.left{justify-content:flex-start;padding-left:9px}
    .side.right{justify-content:flex-start;padding-right:9px}
    .legend{font-size:10px;letter-spacing:.04em}
    .skill .nm{font-size:12px}
    .skill .gap{font-size:11px}
    .summary{gap:6px}
    .chip{padding:7px 9px;font-size:12px;gap:5px}
    .seg{width:100%;display:flex}
    .seg button{flex:1;padding:9px 6px;font-size:12px;min-height:40px}
    .refresh{min-height:40px;padding:8px 10px}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
  @media(max-width:360px){
    .tcmp{display:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="title">
    <h1>ScarosZ <span style="color:var(--gold);-webkit-text-fill-color:var(--gold)">vs</span> Dux Daedalus</h1>
    <div class="sub">RuneScape 3 player comparison</div>
  </div>

  <!-- Total level header -->
  <div class="totals" id="totals"></div>

  <!-- Headline stat tiles: total xp, combat, quest points, quests done -->
  <div class="tiles" id="tiles"></div>

  <!-- Summary -->
  <div class="summary" id="summary"></div>

  <!-- Controls -->
  <div class="controls">
    <div class="seg" id="sort">
      <button data-sort="rs" class="active">RS order</button>
      <button data-sort="gap">Biggest gap</button>
      <button data-sort="lvl">Highest level</button>
    </div>
    <div class="update-controls">
      <div class="status" id="status" role="status" aria-live="polite"><span class="live"></span><span id="statusText">Loading…</span></div>
      <button class="refresh" id="refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        Refresh
      </button>
    </div>
  </div>

  <p class="update-note">Data updates hourly. Refresh loads the latest published update.</p>

  <!-- Skills -->
  <div class="legend">
    <div class="l">ScarosZ</div>
    <div class="c"><span>Skill</span></div>
    <div class="r">Dux Daedalus</div>
  </div>
  <div class="rows" id="rows"></div>

  <!-- Recent activity feed -->
  <h2 class="feedhead">Recent Activity</h2>
  <div class="feed" id="feed"></div>


</div>

<script>
/* ===== Skill order + icons (RS3, 29 skills) ===== */
const SKILLS = [
  "Attack","Defence","Strength","Constitution","Ranged","Prayer","Magic","Cooking",
  "Woodcutting","Fletching","Fishing","Firemaking","Crafting","Smithing","Mining",
  "Herblore","Agility","Thieving","Slayer","Farming","Runecrafting","Hunter",
  "Construction","Summoning","Dungeoneering","Divination","Invention","Archaeology","Necromancy"
];

const PLAYERS = ["ScarosZ", "Dux Daedalus"];
const fmt = n => n.toLocaleString("en-GB");
const escapeHTML = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DATA = {}, XTRA = {}, sortMode = "rs", updatedAt = null, refreshing = false;

/* RS3 combat level from the live skills (DATA[player]: [overall,...29 skills]).
   idx: Att1 Def2 Str3 Con4 Rng5 Pra6 Mag7 ... Sum24 ... Nec29 */
function combatLevel(arr){
  const L=i=>arr[i][0];
  const base=Math.max(L(1)+L(3), 2*L(7), 2*L(5), 2*L(29)); // melee | magic | ranged | necro
  return Math.floor((L(2)+L(4)+Math.floor(L(6)/2)+Math.floor(L(24)/2)+1.3*base)/4);
}
/* compact number: 54,135,223 -> 54.1M */
const short=n=> n>=1e6 ? (n/1e6).toFixed(1).replace(/\.0$/,'')+"M"
              : n>=1e3 ? Math.round(n/1e3)+"K" : ""+n;

/* Data is fetched directly from RuneScape by the hourly Pages workflow. */
function validateSnapshot(snapshot){
  if(!snapshot || !Number.isFinite(Date.parse(snapshot.updatedAt))) throw new Error("Invalid update date");
  for(const name of PLAYERS){
    const player = snapshot.players?.[name];
    if(!player || !Array.isArray(player.skills) || player.skills.length !== 30 ||
      player.skills.some(row => !Array.isArray(row) || row.length !== 2 || row.some(n => !Number.isSafeInteger(n) || n < 0)) ||
      !player.extra || ['qp','qpTotal','qDone','qTotal'].some(key => !Number.isSafeInteger(player.extra[key]) || player.extra[key] < 0) ||
      !Array.isArray(player.extra.acts) || player.extra.acts.some(a => !Array.isArray(a) || a.length !== 2 || a.some(v => typeof v !== 'string')))
      throw new Error("Incomplete player data");
  }
  return snapshot;
}
function dataDate(){
  return new Date(updatedAt).toLocaleString('en-GB', {day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', timeZoneName:'short'});
}
async function refresh(){
  if(refreshing) return;
  refreshing = true;
  const btn = document.getElementById("refresh"), st = document.getElementById("status"), stt = document.getElementById("statusText");
  btn.disabled = true; btn.classList.add("spin"); st.className="status";
  stt.textContent = updatedAt ? "Checking for updates…" : "Loading stats…";
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10000);
  try {
    const response = await fetch('data/players.json', {cache:'no-store', signal:controller.signal});
    if(!response.ok) throw new Error('Data unavailable');
    const snapshot = validateSnapshot(await response.json());
    for(const name of PLAYERS){ DATA[name] = snapshot.players[name].skills; XTRA[name] = snapshot.players[name].extra; }
    updatedAt = snapshot.updatedAt;
    render();
    const stale = Date.now() - Date.parse(updatedAt) > 3 * 60 * 60 * 1000;
    st.className = stale ? 'status err' : 'status ok';
    stt.textContent = (stale ? 'Update delayed · Last fetched ' : 'Fetched ') + dataDate();
  } catch(error) {
    st.className = 'status err';
    stt.textContent = updatedAt ? 'Refresh failed · Showing data fetched ' + dataDate() : 'Stats unavailable. Please try Refresh.';
  } finally {
    clearTimeout(timer); refreshing = false; btn.disabled = false; btn.classList.remove('spin');
  }
}

/* ===== Rendering ===== */
const crownSVG = `<svg class="crown" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M5 47 L11 30 L18 42 L24 22 L28 40 L32 14 L36 40 L40 22 L46 42 L53 30 L59 47 Z"
        fill="currentColor" stroke="#6e4f10" stroke-width=".8" stroke-linejoin="round"/>
  <rect x="5" y="46" width="54" height="9.6" rx="3" fill="currentColor" stroke="#6e4f10" stroke-width=".8"/>
  <path d="M6 50 H58" stroke="#fff3cf" stroke-width=".9" opacity=".4"/>
  <g fill="#fff6d8"><circle cx="11" cy="30" r="2.8"/><circle cx="24" cy="22" r="2.8"/><circle cx="40" cy="22" r="2.8"/><circle cx="53" cy="30" r="2.8"/></g>
  <g fill="#e23b32"><circle cx="14" cy="51" r="1.9"/><circle cx="23" cy="51" r="1.6"/><circle cx="32" cy="51" r="2.6"/><circle cx="41" cy="51" r="1.6"/><circle cx="50" cy="51" r="1.9"/></g>
  <g fill="#ff9a90"><circle cx="13.3" cy="50.3" r=".6"/><circle cx="31.1" cy="50.1" r=".9"/><circle cx="49.3" cy="50.3" r=".6"/></g>
  <circle cx="32" cy="31" r="2.7" fill="#e23b32"/><circle cx="31.1" cy="30.2" r=".9" fill="#ff9a90"/>
  <circle cx="32" cy="12.3" r="3.5" fill="currentColor" stroke="#6e4f10" stroke-width=".8"/>
  <rect x="30.5" y="1.6" width="3" height="10.8" rx="1.3" fill="currentColor" stroke="#6e4f10" stroke-width=".5"/>
  <rect x="27.1" y="4.4" width="9.8" height="3" rx="1.3" fill="currentColor" stroke="#6e4f10" stroke-width=".5"/>
</svg>`;

/* one head-to-head stat tile */
function statTile(label, sub, v1, v2, fmtFn, icon, danger){
  const w = v1>v2?1:v2>v1?2:0;
  const cell=(v,who,n,cls)=>`<div class="tv ${n} ${cls}">
       <div class="num">${fmtFn(v)}</div>
       <div class="who"><span class="sw"></span>${who}</div></div>`;
  return `<div class="tile ${w===0?'tie':''} ${danger?'danger':''}">
     <div class="ticon ${danger?'danger':''}"><img src="icons/${icon}" alt=""></div>
     <div class="tlabel">${label}</div>${sub?`<div class="tsub">${sub}</div>`:''}
     <div class="tvals">
       ${cell(v1,'Scaros','p1',w===1?'win':w===2?'lose':'')}
       <div class="tcmp">${w===1?'›':w===2?'‹':'='}</div>
       ${cell(v2,'Dux','p2',w===2?'win':w===1?'lose':'')}
     </div></div>`;
}

function render(){
  if(!updatedAt) return;
  const p1=PLAYERS[0], p2=PLAYERS[1];
  const o1=DATA[p1][0], o2=DATA[p2][0];

  /* ---- totals ---- */
  const t1Win = o1[0] >= o2[0];
  document.getElementById("totals").innerHTML = `
    <div class="pcard p1 ${o1[0]>o2[0]?'winner':''}">
      ${crownSVG}
      <div class="pname"><span class="dot"></span>${p1}</div>
      <div class="label">Total Level</div>
      <div class="totlvl">${fmt(o1[0])}</div>
      <div class="totxp">${fmt(o1[1])} <span>total XP</span></div>
    </div>
    <div class="vs">
      <div class="vtext">VS</div>
      <div class="delta">${Math.abs(o1[0]-o2[0])} lvl gap</div>
    </div>
    <div class="pcard p2 ${o2[0]>o1[0]?'winner':''}">
      ${crownSVG}
      <div class="pname">${p2}<span class="dot"></span></div>
      <div class="label">Total Level</div>
      <div class="totlvl">${fmt(o2[0])}</div>
      <div class="totxp">${fmt(o2[1])} <span>total XP</span></div>
    </div>`;

  /* ---- per-skill tally ---- */
  let w1=0,w2=0,ties=0;
  const rows = SKILLS.map((name,idx)=>{
    const a=DATA[p1][idx+1], b=DATA[p2][idx+1];
    const la=a[0], lb=b[0];
    let win=0; // 1 = p1, 2 = p2, 0 = tie
    if(la>lb) win=1; else if(lb>la) win=2;
    const lvlTie = la===lb;
    if(lvlTie) ties++; else if(la>lb) w1++; else w2++;
    return {name,idx,la,lb,xa:a[1],xb:b[1],win,lvlTie,gap:Math.abs(la-lb)};
  });

  /* summary */
  document.getElementById("summary").innerHTML = `
    <div class="chip"><span class="sw p1"></span>ScarosZ leads <b>${w1}</b></div>
    <div class="chip"><span class="sw t"></span>Ties <b>${ties}</b></div>
    <div class="chip"><span class="sw p2"></span>Dux leads <b>${w2}</b></div>`;

  /* ---- headline stat tiles ---- */
  const cb1=combatLevel(DATA[p1]), cb2=combatLevel(DATA[p2]);
  const x1=XTRA[p1], x2=XTRA[p2];
  document.getElementById("tiles").innerHTML =
      statTile("Total XP","", o1[1], o2[1], short, "ui-xp.png")
    + statTile("Combat Level","max 152", cb1, cb2, n=>n, "ui-combat.png", true)
    + statTile("Quest Points",x1.qpTotal===x2.qpTotal ? "of "+x1.qpTotal : "", x1.qp, x2.qp, n=>n, "ui-quest.png")
    + statTile("Quests Done",x1.qTotal===x2.qTotal ? "of "+x1.qTotal : "", x1.qDone, x2.qDone, n=>n, "ui-quest2.png");

  /* ---- activity feed ---- */
  const fcol=(p,n)=>`<div class="fcol ${n}">
      <h3><span class="dot"></span>${p}</h3>
      ${(XTRA[p].acts||[]).slice(0,6).map(a=>`<div class="act"><span class="ad">${escapeHTML(a[0])}</span><span class="at">${escapeHTML(a[1])}</span></div>`).join("")
        || '<div class="act"><span class="at" style="color:var(--muted)">No recent activity</span></div>'}
    </div>`;
  document.getElementById("feed").innerHTML = fcol(p1,'p1') + fcol(p2,'p2');

  /* sort */
  let r=[...rows];
  if(sortMode==="gap") r.sort((x,y)=>y.gap-x.gap);
  else if(sortMode==="lvl") r.sort((x,y)=>Math.max(y.la,y.lb)-Math.max(x.la,x.lb));

  const pct = l => Math.max(2, Math.min(100, l/99*100));
  const cls = (side,win) => side==="left"
     ? "side left "+(win===1?"win":win===2?"lose":"")
     : "side right "+(win===2?"win":win===1?"lose":"");

  /* overall row first — per-row normalised so the higher total is a full bar */
  const oWin = o1[0]>o2[0]?1:o2[0]>o1[0]?2:0;
  const oMax = Math.max(o1[0],o2[0],1);
  const overall = `
    <div class="row overall">
      <div class="${cls('left',oWin)}">
        <div class="lvl">${fmt(o1[0])}</div>
        <div class="bar"><div class="fill" style="width:${o1[0]/oMax*100}%"></div></div>
      </div>
      <div class="skill"><div class="nm">Overall</div><div class="gap ${oWin===0?'tie':''}">${oWin===0?'tie':'Δ '+Math.abs(o1[0]-o2[0])}</div></div>
      <div class="${cls('right',oWin)}">
        <div class="lvl">${fmt(o2[0])}</div>
        <div class="bar"><div class="fill" style="width:${o2[0]/oMax*100}%"></div></div>
      </div>
    </div>`;

  const body = r.map(s=>`
    <div class="row">
      <div class="${cls('left',s.win)}">
        <div class="lvl">${s.la}</div>
        <div class="bar"><div class="fill" style="width:${pct(s.la)}%"></div></div>
      </div>
      <div class="skill">
        <img src="icons/${s.name}.png" alt="${s.name}" loading="lazy">
        <div class="nm">${s.name}</div>
        <div class="gap ${s.lvlTie?'tie':''}">${s.lvlTie?'tie':'Δ '+s.gap}</div>
      </div>
      <div class="${cls('right',s.win)}">
        <div class="lvl">${s.lb}</div>
        <div class="bar"><div class="fill" style="width:${pct(s.lb)}%"></div></div>
      </div>
    </div>`).join("");

  document.getElementById("rows").innerHTML = overall + body;
}

/* sort buttons */
document.getElementById("sort").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  document.querySelectorAll("#sort button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); sortMode=b.dataset.sort; render();
});
document.getElementById("refresh").addEventListener("click",refresh);

/* Load the latest published data. */
refresh();
</script>
