name: Update stats and deploy Pages
on:
  push:
    branches: [master]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Refresh RuneScape stats
        id: stats
        run: npm run update -- --defer-on-outage
      - name: Stage site with fresh stats
        if: steps.stats.outputs.updated == 'true'
        run: |
          mkdir _site
          cp index.html _site/
          cp -r icons data _site/
      - uses: actions/configure-pages@v5
        if: steps.stats.outputs.updated == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.stats.outputs.updated == 'true'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.stats.outputs.updated == 'true'
        id: deployment
